services:
  - type: web
    name: schoolms-api
    env: node
    region: oregon
    plan: free

    # Build & start
    buildCommand: cd server && npm install --production=false
    startCommand: cd server && node src/app.js

    # Auto-deploy from main branch
    autoDeploy: true

    # Health check — Render uses this to know the service is up
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # Fill these in the Render dashboard — do NOT commit secrets to Git
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false        # set in Render dashboard
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: REDIS_URL
        sync: false        # Upstash rediss:// URL
      - key: CLIENT_URL
        sync: false        # https://your-app.vercel.app
      # Keep-alive self-ping (prevents Render free-tier sleep after 15 min of inactivity)
      # Set this to the service's own URL, e.g. https://mern-school-management-sytem.onrender.com
      - key: RENDER_SELF_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # ─── Email: Brevo (recommended) ───────────────────────────────────────
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SMTP_USER
        sync: false
      - key: EMAIL_FROM
        sync: false
      # ─── Email: SMTP fallback (optional — leave unset if using Brevo) ─────
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
