<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#0044CC"/>
    </linearGradient>
  </defs>

  <!-- Rounded square bg -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Roof triangle -->
  <polygon points="16,5 27,12 5,12" fill="white" fill-opacity="0.95"/>

  <!-- Building body -->
  <rect x="8" y="12" width="16" height="15" rx="0.5" fill="white" fill-opacity="0.85"/>

  <!-- Door -->
  <rect x="13" y="19" width="6" height="8" rx="1" fill="#1D4ED8"/>

  <!-- Left window -->
  <rect x="9.5" y="14" width="4" height="3.5" rx="0.5" fill="#60A5FA" fill-opacity="0.8"/>

  <!-- Right window -->
  <rect x="18.5" y="14" width="4" height="3.5" rx="0.5" fill="#60A5FA" fill-opacity="0.8"/>

  <!-- Flag pole + flag -->
  <line x1="16" y1="5" x2="16" y2="2" stroke="white" stroke-width="1" stroke-linecap="round"/>
  <polygon points="16,2 20,3.5 16,5" fill="white" fill-opacity="0.9"/>

  <!-- "MS" text at bottom -->
  <text x="16" y="30.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="5.5" font-weight="700" letter-spacing="1" fill="white" fill-opacity="0.0">MS</text>
</svg>
